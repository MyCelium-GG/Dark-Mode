plugins {
    id 'modloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

description = rootProject.description

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
    // Mycel platform implementation: runtime only (entrypoints + services).
    // Declared as a real mod dependency in META-INF/mods.toml for production.
    // (Mycel 1.0.3+ ships a clean POM; older lines needed an exclusion here
    // for FG7's leaked game dependency.)
    runtimeOnly "${mycel_coordinates}"
}

minecraft {
    runs {
        register('client') {
            workingDir = layout.projectDirectory.dir('runs/client')
            args '--mixin.config', 'darkmode.mixins.json'
            // -PquickPlay=localhost:25565 joins that server right after start-up.
            if (project.hasProperty('quickPlay')) {
                args '--quickPlayMultiplayer', project.property('quickPlay').toString()
            }
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
            args '--mixin.config', 'darkmode.mixins.json'
            args '--nogui'
        }
    }
}

// Dev runs get this config from --mixin.config above; real installs read it here.
tasks.named('jar') {
    manifest {
        attributes 'MixinConfigs': 'darkmode.mixins.json'
    }
}

// FastStats, on lines that set faststats_version (see gradle.properties). The SDK jar for this exact
// Minecraft version is embedded; lines without it compile a no-op Stats class instead.
repositories {
    maven {
        name = 'FastStats'
        url = uri('https://repo.faststats.dev/releases')
        content {
            includeGroup('dev.faststats.metrics')
        }
    }
}
def fastStats = (findProperty('faststats_version') ?: '').toString().trim()
if (fastStats) {
    sourceSets.main.java.srcDir(project(':common').file('src/faststats/java'))
    sourceSets.main.java.srcDir('src/faststats/java')
} else {
    sourceSets.main.java.srcDir('src/nofaststats/java')
}
if (fastStats) {
    jarJar.register()
    dependencies {
        implementation(jarJar("dev.faststats.metrics:forge:${fastStats}+mc${minecraft_version}"))
    }
    // The jar-in-jar task's output is the real mod jar, so it takes the plain name the release
    // uploads; the jar without the embedded SDK moves out of build/libs.
    tasks.named('jar') {
        destinationDirectory = layout.buildDirectory.dir('jar-without-jarjar')
    }
    tasks.named('jarJar') {
        archiveClassifier = ''
    }
    tasks.named('assemble') {
        dependsOn 'jarJar'
    }
}
