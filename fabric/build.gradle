plugins {
    id 'modloader-loader'
    id 'net.fabricmc.fabric-loom'
}

description = rootProject.description

dependencies {
    // MC 26.1+ ships non-obfuscated: Loom 1.18+ needs no mappings layer.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Mycel platform implementation: on the run classpath (services are
    // discovered via ServiceLoader; the mod calls Mycel.initialize() itself).
    // Declared as a real mod dependency in fabric.mod.json for production.
    localRuntime "${mycel_coordinates}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // -PquickPlay=localhost:25565 joins that server right after start-up.
            if (project.hasProperty('quickPlay')) {
                programArgs('--quickPlayMultiplayer', project.property('quickPlay'))
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// FastStats, on lines that set faststats_version (see gradle.properties). The SDK jar for this exact
// Minecraft version is embedded; lines without it compile a no-op Stats class instead.
repositories {
    maven {
        name = 'FastStats'
        url = uri('https://repo.faststats.dev/releases')
        content {
            includeGroup('dev.faststats.metrics')
        }
    }
}
def fastStats = (findProperty('faststats_version') ?: '').toString().trim()
if (fastStats) {
    sourceSets.main.java.srcDir(project(':common').file('src/faststats/java'))
    sourceSets.main.java.srcDir('src/faststats/java')
} else {
    sourceSets.main.java.srcDir('src/nofaststats/java')
}
if (fastStats) {
    dependencies {
        implementation "dev.faststats.metrics:fabric:${fastStats}+mc${minecraft_version}"
        include "dev.faststats.metrics:fabric:${fastStats}+mc${minecraft_version}"
    }
}
