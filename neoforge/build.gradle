plugins {
    id 'modloader-loader'
    id 'net.neoforged.moddev'
}

description = rootProject.description

dependencies {
    // Mycel platform implementation: runtime only (entrypoints + services).
    // Declared as a real mod dependency in META-INF/neoforge.mods.toml for production.
    runtimeOnly "${mycel_coordinates}"
}

neoForge {
    version = neoforge_version
    // Automatically enable NeoForge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            // -PquickPlay=localhost:25565 joins that server right after start-up.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlay').toString())
            }
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// FastStats, on lines that set faststats_version (see gradle.properties). The SDK jar for this exact
// Minecraft version is embedded; lines without it compile a no-op Stats class instead.
repositories {
    maven {
        name = 'FastStats'
        url = uri('https://repo.faststats.dev/releases')
        content {
            includeGroup('dev.faststats.metrics')
        }
    }
}
def fastStats = (findProperty('faststats_version') ?: '').toString().trim()
if (fastStats) {
    sourceSets.main.java.srcDir(project(':common').file('src/faststats/java'))
    sourceSets.main.java.srcDir('src/faststats/java')
} else {
    sourceSets.main.java.srcDir('src/nofaststats/java')
}
if (fastStats) {
    dependencies {
        implementation "dev.faststats.metrics:neoforge:${fastStats}+mc${minecraft_version}"
        jarJar "dev.faststats.metrics:neoforge:${fastStats}+mc${minecraft_version}"
    }
}
